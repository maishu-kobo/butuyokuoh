openapi: 3.1.0
info:
  title: Butuyokuoh Agent API
  version: '1.0.0'
  description: |
    会員が発行したエージェント用トークン（`byoagt_`）向け REST API。
    価格・画像はサーバー取得のみ。店舗検索は提供しない。
    MCP は `/api/mcp`（Streamable HTTP, 2025-11-25）。詳細は `/llms.txt`。
servers:
  - url: https://butsuyokuoh.exe.xyz
  - url: /
security:
  - AgentBearer: []
tags:
  - name: meta
  - name: items
  - name: categories
  - name: budget
paths:
  /api/agent/v1/me:
    get:
      tags: [meta]
      summary: トークンと会員プロフィール
      operationId: getAgentMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/agent/v1/items:
    get:
      tags: [items]
      summary: 品目一覧・検索（ゴミ箱の重複も分かる）
      operationId: listAgentItems
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, trashed, purchased, all]
            default: active
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    post:
      tags: [items]
      summary: 項目を指定して追加（価格・画像はサーバ取得）
      operationId: addAgentItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddItemResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/agent/v1/items/by-url:
    post:
      tags: [items]
      summary: URL で追加（add_item_by_url 相当）
      description: |
        公開商品 URL を登録。価格・画像はサーバーが取得。失敗時は名前と URL のみ。
        レート: add + add_url + add_day。
      operationId: addAgentItemByUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemByUrlBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddItemResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/agent/v1/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      summary: 品目1件
      operationId: getAgentItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [items]
      summary: 品目を更新（価格・画像は変更不可）
      operationId: updateAgentItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/agent/v1/items/{id}/purchase:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [items]
      summary: 購入済みにする
      operationId: purchaseAgentItem
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                purchased_at:
                  type: string
                  pattern: '^\\d{4}-\\d{2}-\\d{2}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /api/agent/v1/items/{id}/trash:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [items]
      summary: ゴミ箱へ移す（完全削除なし）
      operationId: trashAgentItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
  /api/agent/v1/items/{id}/price-history:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      summary: 価格履歴（read スコープ）
      operationId: getAgentPriceHistory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryResponse'
  /api/agent/v1/categories:
    get:
      tags: [categories]
      summary: カテゴリ一覧
      operationId: listAgentCategories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
  /api/agent/v1/budget:
    get:
      tags: [budget]
      summary: 出費予定の合計（read スコープ）
      operationId: getAgentBudget
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
  /api/mcp:
    post:
      tags: [meta]
      summary: MCP Streamable HTTP endpoint
      description: |
        JSON-RPC 2.0 over HTTP. Methods: initialize, tools/list, tools/call, ping.
        Protocol 2025-11-25. Same Bearer token. See /llms.txt for tool names.
      operationId: mcpPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ['2.0'] }
                id: { oneOf: [{ type: string }, { type: integer }, { type: 'null' }] }
                method: { type: string }
                params: { type: object, additionalProperties: true }
      responses:
        '200':
          description: JSON-RPC response
        '202':
          description: Notification accepted
components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: byoagt_
      description: 設定画面で発行したエージェント用トークン
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string }
  schemas:
    Notice:
      type: object
      required: [ja, en]
      properties:
        ja: { type: string }
        en: { type: string }
    AgentItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        image_url: { type: string, nullable: true }
        current_price: { type: number, nullable: true }
        priority: { type: integer }
        notes: { type: string, nullable: true }
        is_purchased: { type: boolean }
        deleted_at: { type: string, nullable: true }
        added_by_agent: { type: boolean }
        has_url_duplicate: { type: boolean }
    MeResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            user: { type: object }
            scopes:
              type: array
              items: { type: string, enum: [read, write] }
            token: { type: object }
    ItemListResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentItem' }
            total: { type: integer }
    ItemResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data: { $ref: '#/components/schemas/AgentItem' }
    AddItemBody:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        url: { type: string, format: uri }
        priority: { type: integer, minimum: 1, maximum: 5 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        notes: { type: string, maxLength: 2000 }
        planned_purchase_date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        category_id: { type: integer, minimum: 1 }
        comparison_group_id: { type: integer, minimum: 1 }
    AddItemByUrlBody:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        name: { type: string, maxLength: 200 }
        priority: { type: integer, minimum: 1, maximum: 5 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        notes: { type: string, maxLength: 2000 }
        planned_purchase_date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        category_id: { type: integer, minimum: 1 }
        comparison_group_id: { type: integer, minimum: 1 }
    AddItemResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            item: { $ref: '#/components/schemas/AgentItem' }
            media_fetched: { type: boolean }
    UpdateItemBody:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        url: { type: string, format: uri }
        priority: { type: integer, minimum: 1, maximum: 5 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        notes: { type: string, maxLength: 2000 }
        planned_purchase_date: { type: string, nullable: true, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        category_id: { type: integer, nullable: true, minimum: 1 }
        comparison_group_id: { type: integer, nullable: true, minimum: 1 }
    TrashResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            item: { $ref: '#/components/schemas/AgentItem' }
    PriceHistoryResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            item_id: { type: integer }
            history:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  item_id: { type: integer }
                  price: { type: number }
                  recorded_at: { type: string }
    CategoriesResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            categories:
              type: array
              items: { type: object }
    BudgetResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            months: { type: object, additionalProperties: true }
            undated: { type: object }
            grand_total: { type: number }
