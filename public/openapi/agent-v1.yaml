openapi: 3.1.0
info:
  title: Butuyokuoh Agent API
  version: '1.0.0'
  description: |
    会員が発行したエージェント用トークン（`byoagt_`）向け REST API。
    同じトークンは OAuth 2.1（PKCE）でも発行できる。発見は
    `/.well-known/oauth-protected-resource` と
    `/.well-known/oauth-authorization-server`。
    新規登録の価格・画像はサーバー取得のみ（呼び出し側の値は 400）。null のままの
    `current_price` / `image_url` は `PATCH /api/agent/v1/items/{id}` で一度だけ埋められる
    （判定は各フィールドが null かどうかだけ。値がある側は 409 `MEDIA_ALREADY_SET`）。店舗検索は提供しない。
    MCP は `/api/mcp`（Streamable HTTP, 2025-11-25）。詳細は `/llms.txt`。
servers:
  - url: https://butsuyokuoh.exe.xyz
  - url: /
security:
  - AgentBearer: []
tags:
  - name: meta
  - name: items
  - name: categories
  - name: budget
paths:
  /api/agent/v1/me:
    get:
      tags: [meta]
      summary: トークンと会員プロフィール
      operationId: getAgentMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/agent/v1/items:
    get:
      tags: [items]
      summary: 品目一覧・検索（ゴミ箱の重複も分かる）
      operationId: listAgentItems
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, trashed, purchased, all]
            default: active
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    post:
      tags: [items]
      summary: 項目を指定して追加（価格・画像はサーバ取得）
      operationId: addAgentItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddItemResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/agent/v1/items/by-url:
    post:
      tags: [items]
      summary: URL で追加（add_item_by_url 相当）
      description: |
        公開商品 URL を登録。`url` 1本・既存指定なしは単独品目。
        同じ URL がゴミ箱にだけあるときは復元し `restored_from_trash` を返す（#365）。
        `urls` 複数または `item_id` で既存へ店を足すと origin=photo のグループにまとめる（この経路ではゴミ箱 URL は `URL_IN_TRASH`）。
        価格・画像はサーバーが取得（呼び出し側の値は捨てる）。失敗時は名前と URL のみ。
        レート: add + add_url + add_day を店 URL 件数分まとめて消費。
      operationId: addAgentItemByUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemByUrlBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddItemByUrlResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/agent/v1/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      summary: 品目1件
      operationId: getAgentItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [items]
      summary: 品目を更新（空のままの価格・画像は一度だけ埋められる）
      description: |
        名前・メモ・優先度・数量・予定日・カテゴリ・比較グループ・URL を更新する。
        価格・画像は原則サーバー取得だが、`current_price` / `image_url` が null のフィールドに限り、
        `current_price`（0 より大きく 100,000,000,000 以下の円。小数可）と `image_url`
        （`https://` で始まる公開画像の絶対 URL）を一度だけ埋められる。
        埋められるかは各フィールドが null かどうかだけで決まり、`scrape_status` / `scrape_error`
        は取得失敗の参考情報にすぎない。URL なしの手動品目（`manual://`）も、価格だけ取れて画像が
        空といった一部取得の品目も、null 側のフィールドだけ埋められる。
        片方だけでも、両方でもよい。既に値がある側へ送ると 409 `MEDIA_ALREADY_SET` でボディ全体を
        適用しない。ゴミ箱の品目は 409 `ITEM_TRASHED`。これらの検査は画像ホストの名前解決より先に
        行うので、ホストが解決できなくても 409 が返る。null や空文字で消すことはできない（400）。`price` / `original_price` /
        `target_price` / `imageUrl` の別名は 400。埋めた価格は `price_history` に 1 行残り、
        `/api/agent/v1/budget` に数量掛けで入る。画像 URL はホスト小文字・フラグメント無しの正規形で
        保存され、応答の `image_url` がその保存値。DB の状態に依存する検査（ゴミ箱、媒体が空か、
        カテゴリ・比較グループの所有、URL の重複）と更新は同じトランザクションで行い、途中でゴミ箱に
        入った・別の書き手が価格を入れた・カテゴリが消えた品目は通常の 400 / 409 で何も書かない。
      operationId: updateAgentItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: |
            `ITEM_TRASHED`（ゴミ箱の品目）、`MEDIA_ALREADY_SET`（価格または画像が既に入っている）、
            `URL_TAKEN` / `URL_IN_TRASH`（URL の重複）。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [ITEM_TRASHED, MEDIA_ALREADY_SET, URL_TAKEN, URL_IN_TRASH] }
  /api/agent/v1/items/{id}/purchase:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [items]
      summary: 購入済みにする
      operationId: purchaseAgentItem
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                purchased_at:
                  type: string
                  pattern: '^\\d{4}-\\d{2}-\\d{2}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /api/agent/v1/items/{id}/trash:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [items]
      summary: ゴミ箱へ移す（完全削除なし）
      operationId: trashAgentItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
  /api/agent/v1/items/{id}/price-history:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      summary: 価格履歴（read スコープ）
      operationId: getAgentPriceHistory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryResponse'
  /api/agent/v1/categories:
    get:
      tags: [categories]
      summary: カテゴリ一覧
      operationId: listAgentCategories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
  /api/agent/v1/budget:
    get:
      tags: [budget]
      summary: 出費予定の合計（read スコープ）
      operationId: getAgentBudget
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
  /api/mcp:
    post:
      tags: [meta]
      summary: MCP Streamable HTTP endpoint
      description: |
        JSON-RPC 2.0 over HTTP. Methods: initialize, tools/list, tools/call, ping.
        Protocol 2025-11-25. Same Bearer token. See /llms.txt for tool names.
      operationId: mcpPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ['2.0'] }
                id: { oneOf: [{ type: string }, { type: integer }, { type: 'null' }] }
                method: { type: string }
                params: { type: object, additionalProperties: true }
      responses:
        '200':
          description: JSON-RPC response
        '202':
          description: Notification accepted
components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: byoagt_
      description: 設定画面で発行したエージェント用トークン
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string }
  schemas:
    Notice:
      type: object
      required: [ja, en]
      properties:
        ja: { type: string }
        en: { type: string }
    AgentStore:
      type: object
      properties:
        item_id: { type: integer }
        url: { type: string }
        store: { type: string }
        source: { type: string }
        current_price: { type: number, nullable: true }
        image_url: { type: string, nullable: true }
        scrape_status:
          type: [string, 'null']
          enum: [success, failed, null]
          description: 直近のサーバー取得の結果。未取得なら null。
        scrape_error_code:
          type: [string, 'null']
          enum: [BOT_CHALLENGE, FETCH_FAILED, null]
          description: 失敗の種別。`scrape_status` が `failed` のときだけ入る。
        scrape_error:
          type: [string, 'null']
          description: 取得失敗の理由（利用者向けの定型文だけ。内部の例外文は出さない）。成功・未取得なら null。
    AgentItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        image_url: { type: string, nullable: true }
        current_price: { type: number, nullable: true }
        priority: { type: integer }
        notes: { type: string, nullable: true }
        is_purchased: { type: boolean }
        deleted_at: { type: string, nullable: true }
        added_by_agent: { type: boolean }
        has_url_duplicate: { type: boolean }
        comparison_group_id: { type: integer, nullable: true }
        scrape_status:
          type: [string, 'null']
          enum: [success, failed, null]
          description: |
            直近のサーバー取得の結果。参考情報。PATCH で `current_price` / `image_url`
            を埋められるかは、この値ではなく各フィールドが null かどうかだけで決まる。
        scrape_error_code:
          type: [string, 'null']
          enum: [BOT_CHALLENGE, FETCH_FAILED, null]
          description: |
            失敗の種別。`scrape_status` が `failed` のときだけ入る。ボット対策・待機ページ・Amazon の
            ボット判定は `BOT_CHALLENGE`、それ以外は `FETCH_FAILED`。
        scrape_error:
          type: [string, 'null']
          description: |
            取得失敗の理由。利用者向けの定型文だけで、内部の例外文（接続エラーや URL）は出さない。
            成功・未取得なら null。
        stores:
          type: array
          items: { $ref: '#/components/schemas/AgentStore' }
    MeResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            user: { type: object }
            scopes:
              type: array
              items: { type: string, enum: [read, write] }
            token: { type: object }
    ItemListResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AgentItem' }
            total: { type: integer }
    ItemResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data: { $ref: '#/components/schemas/AgentItem' }
    AddItemBody:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        url: { type: string, format: uri }
        priority: { type: integer, minimum: 1, maximum: 5 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        notes: { type: string, maxLength: 2000 }
        planned_purchase_date:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}$'
          description: YYYY-MM-DD の実在する暦日（2026-13-45 等は 400）。価格・画像フィールドは不可。
        category_id: { type: integer, minimum: 1 }
        comparison_group_id: { type: integer, minimum: 1 }
    AddItemByUrlBody:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        urls:
          type: array
          minItems: 1
          maxItems: 10
          description: 上限は add_url の分あたり制限と同じ（AGENT_RATE_LIMITS.add_url）
          items: { type: string, format: uri }
        item_id: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 200 }
        priority: { type: integer, minimum: 1, maximum: 5 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        notes: { type: string, maxLength: 2000 }
        planned_purchase_date:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}$'
          description: YYYY-MM-DD の実在する暦日（2026-13-45 等は 400）。価格・画像フィールドは不可。
        category_id: { type: integer, minimum: 1 }
        comparison_group_id: { type: integer, minimum: 1 }
    MediaFetchError:
      type: object
      required: [url, code, message]
      properties:
        url: { type: string, format: uri }
        code: { type: string, enum: [BOT_CHALLENGE, FETCH_FAILED] }
        message: { type: string }
    AddItemResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            item: { $ref: '#/components/schemas/AgentItem' }
            media_fetched: { type: boolean }
            media_fetch_errors:
              type: array
              description: URL ごとの取得失敗理由。手動品目や取得成功時は空配列。
              items: { $ref: '#/components/schemas/MediaFetchError' }
    AddItemByUrlResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            item: { $ref: '#/components/schemas/AgentItem' }
            stores:
              type: array
              items: { $ref: '#/components/schemas/AgentStore' }
            media_fetched: { type: boolean }
            media_fetch_errors:
              type: array
              description: URL ごとの取得失敗理由。複数店の一部だけ成功すると media_fetched は true でも失敗が含まれる。
              items: { $ref: '#/components/schemas/MediaFetchError' }
    UpdateItemBody:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        url: { type: string, format: uri }
        priority: { type: integer, minimum: 1, maximum: 5 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        notes: { type: string, maxLength: 2000 }
        planned_purchase_date:
          type: string
          nullable: true
          pattern: '^\\d{4}-\\d{2}-\\d{2}$'
          description: YYYY-MM-DD の実在する暦日。null でクリア。
        category_id: { type: integer, nullable: true, minimum: 1 }
        comparison_group_id: { type: integer, nullable: true, minimum: 1 }
        current_price:
          type: number
          exclusiveMinimum: 0
          maximum: 100000000000
          description: |
            円の価格（整数を推奨。小数可）。上限は 100,000,000,000（1,000 億円）で、数量の上限 999 を
            掛けても合計が安全な整数に収まる。`current_price` が null の品目にだけ設定できる
            （`scrape_status` は判定に使わない。手動品目や一部取得の品目も同じ）。
            既に価格がある品目は 409 `MEDIA_ALREADY_SET`。null・負数・上限超え・文字列は 400。
            `price` / `original_price` / `target_price` の別名は受け付けない。
        image_url:
          type: string
          format: uri
          pattern: '^[Hh][Tt][Tt][Pp][Ss]://'
          maxLength: 2000
          description: |
            `https://` で始まる公開画像の絶対 URL（スキームの大文字小文字は問わない）。`https:cdn.example/a.png` や
            `https:/cdn.example/a.png` のような省略形はブラウザが基底 URL によって別の場所と解釈するので 400。
            保存はスキーム・ホスト小文字、フラグメント無しの正規形。`image_url` が null の品目にだけ設定できる
            （`scrape_status` は判定に使わない）。
            既に画像がある品目は 409 `MEDIA_ALREADY_SET`。http・data・javascript スキーム、認証情報やポート付き、
            内部アドレスへ解決するホストは 400。`imageUrl` の別名は受け付けない。
    TrashResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            item: { $ref: '#/components/schemas/AgentItem' }
    PriceHistoryResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            item_id: { type: integer }
            history:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  item_id: { type: integer }
                  price: { type: number }
                  recorded_at: { type: string }
    CategoriesResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            categories:
              type: array
              items: { type: object }
    BudgetResponse:
      type: object
      required: [data, notice]
      properties:
        notice: { $ref: '#/components/schemas/Notice' }
        data:
          type: object
          properties:
            months: { type: object, additionalProperties: true }
            undated: { type: object }
            grand_total: { type: number }
