name: main validation and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    # Keep the CodeQL caller/configuration identical on main and its PRs.
    # The deploy job below still rejects every PR before accessing production.
    branches: [feature/auto-deploy, main]

permissions:
  contents: read

concurrency:
  group: main-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      github_hosted_only: true
  browser:
    uses: ./.github/workflows/playwright.yml
  secrets-scan:
    uses: ./.github/workflows/gitleaks.yml
  quarantine:
    uses: ./.github/workflows/quarantine.yml
  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
  deploy:
    needs: [ci, browser, secrets-scan, quarantine, security]
    if: >-
      github.repository == 'maishu-kobo/butuyokuoh' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://butsuyokuoh.exe.xyz/
    concurrency:
      group: butuyokuoh-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy checked main SHA and verify completion
        env:
          GH_TOKEN: ${{ github.token }}
          EXE_DEPLOY_HOST: ${{ vars.EXE_DEPLOY_HOST }}
          EXE_DEPLOY_USER: exedev
          EXE_DEPLOY_SSH_KEY: ${{ secrets.EXE_DEPLOY_SSH_KEY }}
          EXE_DEPLOY_KNOWN_HOSTS: ${{ secrets.EXE_DEPLOY_KNOWN_HOSTS }}
        run: python3 scripts/deploy/client.py
