# pull_request だけ。
# このリポジトリは CodeQL の default setup が有効で、advanced の SARIF は受け取らない。
# 解析自体は行い、error があればジョブを落とす。warning はログに残す。アップロードはしない。
name: CodeQL

on:
  pull_request:
    branches:
      - feature/photo-capture
      - develop

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          upload-database: false
          output: ${{ github.workspace }}/codeql-results

      - name: Fail on CodeQL findings
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          files = sorted(Path("codeql-results").rglob("*.sarif"))
          if not files:
              print("CodeQL の SARIF が無い", file=sys.stderr)
              sys.exit(1)
          lines = []
          failed = False
          for path in files:
              data = json.loads(path.read_text())
              for run in data.get("runs", []):
                  results = run.get("results", [])
                  lines.append(f"{path.name}: {len(results)} results")
                  for result in results:
                      level = result.get("level", "warning")
                      rule = result.get("ruleId", "")
                      message = result.get("message", {}).get("text", "").split("\n", 1)[0]
                      location = result.get("locations", [{}])[0].get("physicalLocation", {})
                      uri = location.get("artifactLocation", {}).get("uri", "")
                      line = location.get("region", {}).get("startLine", "")
                      lines.append(f"- {level} {rule} {uri}:{line} {message}")
                      if level == "error":
                          failed = True
          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## CodeQL\n\n```\n" + "\n".join(lines) + "\n```\n")
          if failed:
              sys.exit(1)
          PY
