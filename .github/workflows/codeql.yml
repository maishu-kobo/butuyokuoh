# pull_request だけ。
# default setup が有効なため advanced の SARIF は拒否される。
# SARIF の送信は default setup と衝突する。管理者が default setup を止めるまで、送信失敗ではジョブを落とさない。
# 解析失敗と high 判定の失敗は落とす。
# security-severity が 7.0 以上（high）は落とす。
# // codeql コメントと SARIF の suppressions では通さない。
# 例外は .github/codeql/suppressions.json の rule、path、行本文が一致するときだけ。
# default setup だけにすると feature/photo-capture 向け PR はスキャンされない。
name: CodeQL

on:
  pull_request:
    branches:
      - feature/photo-capture
      - develop

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the high-severity gate
        run: python3 .github/codeql/high_gate_test.py

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: always
          upload-database: false
          output: ${{ github.workspace }}/codeql-results

      - name: Note the known upload conflict
        if: ${{ !cancelled() && steps.codeql-analyze.outcome == 'failure' }}
        run: echo "::warning::CodeQL の SARIF 送信が失敗した。default setup が advanced の結果を拒否する既知の設定で、管理者が default setup を止めるまで送信は必須にしない。high 判定は次のステップで落とす。"

      - name: Fail on high severity findings
        if: ${{ !cancelled() }}
        run: python3 .github/codeql/high_gate.py codeql-results .github/codeql/suppressions.json .
