# Replace repository-level default setup for main without changing application code.
# Feature PRs use their existing advanced workflow; default setup must remain off.
name: CodeQL main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-main-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # Omit queries to retain the default security suite.

      - name: Analyze and ingest results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: always
          wait-for-processing: true
          upload-database: false
