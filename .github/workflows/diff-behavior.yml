# develop を正にした差分。必須チェックには入れない。
# pull_request_target は使わない。権限はチェックアウトだけ。
name: Differential behavior

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/photo-capture
      - develop
    paths:
      - src/lib/db.ts
      - src/auth.ts
      - src/app/api/items/**

permissions:
  contents: read

concurrency:
  group: diff-behavior-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: develop diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROME_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Compare with develop
        run: npm run test:diff
