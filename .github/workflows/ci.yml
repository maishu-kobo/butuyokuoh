# Issue #85。feature/photo-capture、feature/capture-existing-bugfixes、develop 向け PR の速いレーン。
# 単体テスト、型、lint、本番ビルド、npm audit。キャッシュが温かいときの目標は 2 分未満。
# 同じコマンドをこのファイルに重ねない。重い検査は別ファイルで、毎回走り、失敗すると止める。
#
# - playwright.yml（e2e。ジョブ名 playwright）
# - codeql.yml（analyze の high）
# - dependency-review.yml
# - gitleaks.yml
#
# フレークの隔離は quarantine.yml。失敗すると赤になる。チェック名は必須の名前ではない。
# 保護したテストは .github/test-quarantine.txt に書けない。このレーンが拒否する。
# 実店舗の e2e（E2E_LIVE_SCRAPE / E2E_LIVE_AMAZON / E2E_LIVE_RAKUTEN）は環境変数を付けない。
# develop への push でも実行する。main への push は deploy-main.yml の reusable 呼び出しに寄せる。
# マージ条件（必須ステータスチェック）はリポジトリ設定なので、このファイルではしない。
# path フィルタは付けない。必須ジョブが skip になると、その SHA のチェックが pending のままマージを止める。
name: CI

on:
  workflow_call:
    inputs:
      github_hosted_only:
        description: When true, skip Blacksmith and stay on GitHub-hosted runners
        type: boolean
        default: true
  pull_request:
    branches:
      - feature/photo-capture
      - feature/capture-existing-bugfixes
      - feature/auto-deploy
      - develop
      - main
  push:
    branches:
      - feature/photo-capture
      - develop
      # main への push は deploy-main.yml 内の reusable ci に寄せる（二重起動を避ける）。

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Hold the main lock from selection until checks finish; PRs keep latest-run behavior.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  select-runner:
    name: Select CI runner
    # The environment allows only main. PR jobs cannot access its organization token.
    # reusable 呼び出しでは github.event_name が workflow_call になる。
    if: >-
      ${{ !inputs.github_hosted_only && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_call') &&
          github.run_attempt == 1 && vars.BLACKSMITH_NO_CHARGE_CONFIRMED != '' &&
          vars.BLACKSMITH_BUDGET != '' }}
    permissions:
      contents: read
      actions: read
    environment: blacksmith-budget
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.budget.outcome == 'success' && steps.budget.outputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve free CI budget
        id: budget
        continue-on-error: true
        timeout-minutes: 2
        env:
          BLACKSMITH_NO_CHARGE_CONFIRMED: ${{ vars.BLACKSMITH_NO_CHARGE_CONFIRMED }}
          BLACKSMITH_BUDGET: ${{ vars.BLACKSMITH_BUDGET }}
          BLACKSMITH_ORG_TOKEN: ${{ secrets.BLACKSMITH_ORG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/blacksmith-cli.sh

  check:
    name: test, types, build
    needs: select-runner
    # A skipped/failed/timed-out selector must not skip the actual checks.
    if: ${{ !cancelled() }}
    # Re-runs can reuse an old selector output: re-check the attempt here as well.
    runs-on: >-
      ${{ !inputs.github_hosted_only && github.run_attempt == 1 &&
          (github.event_name == 'push' || github.event_name == 'workflow_call') &&
          github.ref == 'refs/heads/main' && needs.select-runner.result == 'success' &&
          needs.select-runner.outputs.runner == 'blacksmith-4vcpu-ubuntu-2404' &&
          'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # puppeteer 25 は Node.js 22.12 以上。本番を 22 に上げてから develop に入れる（docs/deployment.md）。
          node-version: "22"
          # lockfile をキーにする。pull_request の cache はマージ ref に閉じ、トークンは contents: read のまま。
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # node_modules ヒット時は postinstall が走らない。Chrome 本体は ~/.cache/puppeteer 側。
      - name: Ensure Puppeteer Chrome
        if: steps.node-modules.outputs.cache-hit == 'true'
        run: npx puppeteer browsers install chrome

      # Chrome のサンドボックスは非特権 user namespace を使う。
      # Ubuntu 23.10 以降は AppArmor がそれを止め、No usable sandbox! で起動前に死ぬ。
      # --no-sandbox は付けない。この捨てるランナーで、その制限だけを外す。
      - name: Allow the Chrome sandbox user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # 隔離リストに入った単体テストだけ外す。0 件のときは npm test と同じファイル。
      # ローカルの npm test はリストを見ない。
      - name: Unit tests
        run: node scripts/test-lanes.mjs blocking-unit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      # 既存の警告は残す。新しい警告だけを落とす。警告の一括修正はしない。
      - name: Lint warning baseline
        run: node scripts/lint-warnings.mjs check

  audit:
    name: npm audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # puppeteer 25 は Node.js 22.12 以上。本番を 22 に上げてから develop に入れる（docs/deployment.md）。
          node-version: "22"
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # braces は開発依存だけの期限つき例外。.github/audit-exceptions.json を見る。
      - name: npm audit
        run: npm run audit:high
