# Issue #85。feature/photo-capture、feature/capture-existing-bugfixes、develop 向け PR の共通検査。
# 同じコマンドのワークフローを別に足さない。足すときはこのファイルを伸ばす。
#
# pull_request だけで、権限が違う検査は別ファイル:
# - codeql.yml
# - dependency-review.yml
# - gitleaks.yml
#
# 実店舗の e2e（E2E_LIVE_SCRAPE / E2E_LIVE_AMAZON / E2E_LIVE_RAKUTEN）は環境変数を付けない。
# develop への push と、マージ条件への組み込みはここではしない。
# path フィルタは付けない。必須ジョブが skip になると、その SHA のチェックが pending のままマージを止める。
name: CI

on:
  pull_request:
    branches:
      - feature/photo-capture
      - feature/capture-existing-bugfixes
      - develop
  push:
    branches:
      - feature/photo-capture

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # puppeteer 25 は Node.js 22.12 以上。本番を 22 に上げてから develop に入れる（docs/deployment.md）。
          node-version: "22"
          # lockfile をキーにする。pull_request の cache はマージ ref に閉じ、トークンは contents: read のまま。
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # puppeteer 25 は Node.js 22.12 以上。本番を 22 に上げてから develop に入れる（docs/deployment.md）。
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # braces は開発依存だけの期限つき例外。.github/audit-exceptions.json を見る。
      - name: npm audit
        run: npm run audit:high

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # puppeteer 25 は Node.js 22.12 以上。本番を 22 に上げてから develop に入れる（docs/deployment.md）。
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # ブラウザ本体だけ。OS パッケージはランナーが毎回新しいのでキャッシュしない。
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      # テストの既定ブラウザは chromium。firefox / webkit の apt が 10 分以上止まる。
      # --with-deps はキャッシュミスだけ。ヒット時は OS 依存だけ入れ直す。
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: E2E tests
        run: npm run test:e2e
