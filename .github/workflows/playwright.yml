# 重いレーン。feature/photo-capture、feature/capture-existing-bugfixes、develop、main 向け PR で毎回走る。
# develop への push でも実行する。失敗すると止める。既定ジョブ名は playwright のまま。
# path フィルタは付けない。
# 権限は contents: read だけ。失敗時の artifact は upload-artifact v4 が上げる。actions: write は付けない。
#
# 実店舗の e2e（E2E_LIVE_SCRAPE / E2E_LIVE_AMAZON / E2E_LIVE_RAKUTEN）は環境変数を付けない。
# 実店舗は tests/e2e/live-shops.spec.ts。CI のレーンには入れない。
# マージ条件（必須ステータスチェック）はリポジトリ設定なので、このファイルではしない。
name: playwright

on:
  pull_request:
    branches:
      - feature/photo-capture
      - feature/capture-existing-bugfixes
      - develop
      - main
  push:
    branches:
      - feature/photo-capture
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: playwright
            slug: default
            production: ''
            guest_disabled: ''
            build: 'false'
          - name: production smoke
            slug: production
            production: '1'
            guest_disabled: ''
            build: 'true'
          - name: guest disabled
            slug: guest-disabled
            production: ''
            guest_disabled: '1'
            build: 'false'
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_PRODUCTION: ${{ matrix.production }}
      E2E_GUEST_DISABLED: ${{ matrix.guest_disabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # puppeteer 25 は Node.js 22.12 以上。本番を 22 に上げてから develop に入れる（docs/deployment.md）。
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        if: matrix.build == 'true'
        run: npm run build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # ブラウザ本体だけ。apt のパッケージはキャッシュしない。restore-keys は付けない。
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      # chromium の共有ライブラリは ubuntu-24.04 に入っている。
      # --with-deps は apt が 30 分で打ち切られるまで止まっていた（#122 f432e7b）。使わない。
      # 公式イメージ v1.64.1-noble は約 940MiB で、毎回の pull はブラウザの zip より遅い。
      # キャッシュヒット時は導入しない。
      - name: Install Playwright browsers
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # dry-run はブラウザが欠けていても成功する。印、実行ファイル、バージョンで落とす。
      # sha256 はログに出す。browsers.json に実行ファイルのダイジェストは無い。
      # ヒットでもミスでも実行する。古いキャッシュを静かに使わない。
      - name: Verify Playwright browsers
        timeout-minutes: 5
        run: node scripts/verify-playwright-browsers.mjs

      # playwright test --list のファイルから、隔離分だけを引く。0 件でも同じコマンド。
      # レーンは E2E_PRODUCTION / E2E_GUEST_DISABLED。既定は開発サーバと固定fixture。
      - name: E2E tests
        run: node scripts/test-lanes.mjs blocking-e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
