# 重いレーン。feature/photo-capture、feature/capture-existing-bugfixes、develop 向け PR で毎回走る。
# 失敗すると止める。ジョブ名は playwright のまま。path フィルタは付けない。
# 権限は contents: read。actions: write は足さない。キャッシュの保存は pull_request の既定。
#
# 実店舗の e2e（E2E_LIVE_SCRAPE / E2E_LIVE_AMAZON / E2E_LIVE_RAKUTEN）は環境変数を付けない。
# develop への push と、マージ条件への組み込みはここではしない。
name: playwright

on:
  pull_request:
    branches:
      - feature/photo-capture
      - feature/capture-existing-bugfixes
      - develop
  push:
    branches:
      - feature/photo-capture

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # puppeteer 25 は Node.js 22.12 以上。本番を 22 に上げてから develop に入れる（docs/deployment.md）。
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # ブラウザ本体だけ。apt のパッケージはキャッシュしない。restore-keys は付けない。
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      # chromium の共有ライブラリは ubuntu-24.04 に入っている。
      # --with-deps は apt が 30 分で打ち切られるまで止まっていた（#122 f432e7b）。使わない。
      # 公式イメージ v1.64.1-noble は約 940MiB で、毎回の pull はブラウザの zip より遅い。
      # キャッシュヒット時は導入しない。
      - name: Install Playwright browsers
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # dry-run はブラウザが欠けていても成功する。印、実行ファイル、バージョンで落とす。
      # sha256 はログに出す。browsers.json に実行ファイルのダイジェストは無い。
      # ヒットでもミスでも実行する。古いキャッシュを静かに使わない。
      - name: Verify Playwright browsers
        timeout-minutes: 5
        run: node scripts/verify-playwright-browsers.mjs

      # playwright test --list のファイルから、隔離分だけを引く。0 件でも同じコマンド。
      - name: E2E tests
        run: node scripts/test-lanes.mjs blocking-e2e
